<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Dino Hayoti 3D</title>
<meta name="theme-color" content="#0f2a1e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{--ink:#0f2a1e;--moss:#2f5d3a;--leaf:#9bdc6a;--bone:#f4ecd3;--ember:#f08a3c;--blood:#e5484d;--sun:#f4c64e;--lake:#4aa9e3;--boss:#c04bff;--panel:rgba(10,30,20,.62);--line:rgba(244,236,211,.22);--display:'Lilita One','Trebuchet MS',system-ui,sans-serif;--body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--body);font-weight:600;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#game,#touch,#vig{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
#touch{z-index:1}
#vig{z-index:2;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(229,72,77,.75) 100%);transition:opacity .15s}
#ui{position:fixed;inset:0;z-index:3;pointer-events:none;--sa:env(safe-area-inset-bottom,0px);--st:max(10px,env(safe-area-inset-top,0px));--sl:max(10px,env(safe-area-inset-left,0px));--sr:max(12px,env(safe-area-inset-right,0px));--b:clamp(80px,23vmin,108px)}
#bars{position:absolute;top:var(--st);left:var(--sl);width:min(44vw,196px);display:grid;gap:4px;padding:7px 8px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row{display:grid;grid-template-columns:32px 1fr;align-items:center;gap:6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;opacity:.95}
.row i,.xpbar{position:relative;display:block;height:15px;background:rgba(0,0,0,.45);border-radius:5px;overflow:hidden}
.row b,.xpbar b{display:block;height:100%;width:100%;border-radius:5px;transition:width .12s}
.row em,.xpbar em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000,0 0 3px #000;text-transform:none}
.hp{background:var(--blood)}.en{background:var(--sun)}.fd{background:var(--ember)}.wt{background:var(--lake)}
#side{position:absolute;top:var(--st);right:var(--sr);display:grid;gap:5px;justify-items:end}
#radar{width:76px;height:76px;border-radius:50%;background:var(--panel);border:1px solid var(--line)}
#lvl{font-family:var(--display);font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.xpbar{width:84px;height:14px}.xpbar b{background:var(--leaf);width:0}
#boss{position:absolute;top:calc(var(--st) + 140px);left:50%;transform:translateX(-50%);width:min(52vw,300px);text-align:center;font-family:var(--display);font-size:13px;display:none;text-shadow:0 1px 3px #000}
#boss i{position:relative;display:block;height:15px;margin-top:3px;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#boss b{display:block;height:100%;width:100%;background:var(--boss)}
#o2{position:absolute;top:calc(var(--st) + 100px);left:50%;transform:translateX(-50%);width:min(40vw,200px);text-align:center;font-family:var(--display);font-size:12px;display:none;text-shadow:0 1px 3px #000;color:#cfeeff}
#o2 i{display:block;height:10px;margin-top:2px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:6px;overflow:hidden}
#o2 b{display:block;height:100%;width:100%;background:#4ac8f0}
#boss em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:10px;font-family:var(--body);font-weight:800;color:#fff}
#toast{position:absolute;left:50%;top:calc(var(--st) + 100px);transform:translate(-50%,-4px);max-width:60vw;padding:5px 12px;background:var(--panel);border:1px solid var(--line);border-radius:999px;font-size:12px;text-align:center;opacity:0;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;left:50%;top:34%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(20px,6vmin,30px);color:var(--sun);text-shadow:0 2px 10px rgba(0,0,0,.8);opacity:0;transition:opacity .6s;text-align:center;white-space:nowrap}
#banner.show{opacity:1}
#joy{position:absolute;left:calc(var(--sl) + 16px);bottom:calc(var(--sa) + 34px);width:clamp(104px,28vmin,128px);height:clamp(104px,28vmin,128px);border-radius:50%;background:rgba(244,236,211,.08);border:2px solid var(--line);opacity:.55}
#joy.on{bottom:auto;transform:translate(-50%,-50%);opacity:1}
#knob{position:absolute;left:50%;top:50%;width:46%;height:46%;margin:-23% 0 0 -23%;border-radius:50%;background:rgba(244,236,211,.4);border:2px solid var(--bone)}
.btn{position:absolute;pointer-events:auto;border:2px solid var(--bone);border-radius:50%;background:rgba(15,42,30,.72);color:var(--bone);font-family:var(--display);letter-spacing:.02em;display:grid;place-items:center;touch-action:none;-webkit-user-select:none;user-select:none;cursor:pointer;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.btn:active,.btn.hold{background:var(--leaf);color:var(--ink);transform:scale(.94)}
.btn.ping{background:var(--sun);color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
#bMenu{top:var(--st);right:calc(var(--sr) + 86px);width:46px;height:46px;font-size:21px}
#bBite{right:var(--sr);bottom:calc(var(--sa) + 28px);width:var(--b);height:var(--b);font-size:calc(var(--b)*.22);background:rgba(229,72,77,.82)}
#bSprint{right:calc(var(--sr) + var(--b) + 6px);bottom:calc(var(--sa) + 22px);width:calc(var(--b)*.68);height:calc(var(--b)*.68);font-size:calc(var(--b)*.14)}
#bRoar{right:calc(var(--sr) + var(--b)*.18);bottom:calc(var(--sa) + 28px + var(--b) + 10px);width:calc(var(--b)*.66);height:calc(var(--b)*.66);font-size:calc(var(--b)*.14)}
#bRoar.cool{opacity:.45}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px max(20px,env(safe-area-inset-left,0px));background:rgba(10,30,20,.66)}
.screen[hidden]{display:none}
.screen h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(44px,14vw,84px);line-height:.95;color:var(--leaf);text-shadow:0 3px 0 #1c3d28,0 8px 24px rgba(0,0,0,.5);text-wrap:balance}
.screen p{margin:0;max-width:34ch;font-size:15px;line-height:1.45;text-wrap:balance}
.tips{display:grid;gap:6px;max-width:38ch;margin:6px 0 4px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px;text-align:left}
.tips span{color:var(--sun)}
.go{font-family:var(--display);font-size:24px;letter-spacing:.03em;padding:12px 34px;border:0;border-radius:999px;background:var(--leaf);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 #4d8a31}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #4d8a31}
.go.alt{background:rgba(244,236,211,.16);color:var(--bone);box-shadow:none;font-size:17px;padding:9px 22px}
.go:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.panel{width:min(94vw,430px);max-height:90vh;overflow:auto;touch-action:pan-y;padding:14px;background:rgba(10,30,20,.94);border:1px solid var(--line);border-radius:14px;text-align:left;font-size:14px}
.panel h2{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:28px;color:var(--leaf)}
.sec{margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
.srow small{color:rgba(244,236,211,.7);font-weight:600}
.mb{font-family:var(--display);font-size:16px;padding:8px 16px;border:0;border-radius:999px;background:var(--leaf);color:var(--ink);cursor:pointer;min-width:44px}
.mb.alt{background:rgba(244,236,211,.14);color:var(--bone)}
.mb[disabled]{opacity:.35}
#bTalk{left:calc(var(--sl) + 16px);bottom:calc(var(--sa) + 34px + clamp(104px,28vmin,128px) + 14px);width:92px;height:56px;border-radius:28px;font-size:17px;background:rgba(244,198,78,.95);color:var(--ink)}
.panel p{margin:6px 0;line-height:1.4}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tb{flex:1;font:inherit;font-weight:800;font-size:11px;padding:8px 1px;border:1px solid var(--line);border-radius:8px;background:rgba(244,236,211,.08);color:var(--bone);cursor:pointer}
.tb.on{background:var(--leaf);color:var(--ink);border-color:var(--leaf)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
@media (orientation:landscape) and (max-height:520px){
#ui{--b:clamp(62px,27vmin,84px)}
#bars{width:min(34vw,176px);padding:5px 7px;gap:3px}
#bMenu{right:calc(var(--sr) + 70px);width:42px;height:42px}
.row i,.xpbar{height:13px}
.row em,.xpbar em{font-size:9px}
#radar{width:60px;height:60px}
#side{gap:3px}
#lvl{font-size:13px}
.xpbar{width:76px;height:12px}
#bBite{bottom:calc(var(--sa) + 14px)}
#bSprint{right:calc(var(--sr) + var(--b) + 8px);bottom:calc(var(--sa) + 12px)}
#bRoar{right:calc(var(--sr) + var(--b) + 16px + var(--b)*.68);bottom:calc(var(--sa) + 12px)}
#joy{bottom:calc(var(--sa) + 14px)}
#bTalk{left:50%;margin-left:-46px;bottom:calc(var(--sa) + 16px)}
#boss{top:calc(var(--st) + 74px);width:min(40vw,260px)}
#toast{top:calc(var(--st) + 58px)}
}
@media (prefers-reduced-motion:reduce){#toast,.row b,#vig,#banner{transition:none}}
</style>
</head>
<body>
<div id="game"></div>
<div id="touch"></div>
<div id="vig"></div>
<div id="ui">
  <div id="bars">
    <div class="row"><span>Jon</span><i><b id="hpB" class="hp"></b><em id="hpT"></em></i></div>
    <div class="row"><span>Kuch</span><i><b id="enB" class="en"></b><em id="enT"></em></i></div>
    <div class="row"><span>Och</span><i><b id="fdB" class="fd"></b><em id="fdT"></em></i></div>
    <div class="row"><span>Suv</span><i><b id="wtB" class="wt"></b><em id="wtT"></em></i></div>
  </div>
  <div id="side">
    <canvas id="radar" width="88" height="88"></canvas>
    <div id="lvl">1-daraja</div>
    <i class="xpbar"><b id="xpB"></b><em id="xpT"></em></i>
  </div>
  <button class="btn" id="bMenu" type="button" aria-label="Menyu">&#9776;</button>
  <div id="o2"><span>Havo</span><i><b id="o2B"></b></i></div>
  <div id="boss"><span id="bossN">Alfa Rex</span><i><b id="bossB"></b><em id="bossT"></em></i></div>
  <div id="toast"></div>
  <div id="banner"></div>
  <div id="joy"><div id="knob"></div></div>
  <button class="btn" id="bSprint" type="button">Chopish</button>
  <button class="btn" id="bRoar" type="button">Hurkish</button>
  <button class="btn" id="bBite" type="button">Tishla</button>
  <button class="btn" id="bTalk" type="button" style="display:none">Gapir</button>
</div>

<div id="start" class="screen">
  <h1>Dino<br>Hayoti</h1>
  <button class="go" id="goBtn" type="button">Play</button>
  <button class="go alt" id="setBtn" type="button">Sozlamalar</button>
</div>
<div id="talk" class="screen" hidden><div class="panel" id="talkBody"></div></div>
<div id="dead" class="screen" hidden>
  <h1>Halok<br>bo'ldingiz</h1>
  <p id="deadInfo"></p>
  <button class="go" id="againBtn" type="button">Qayta tirilish</button>
</div>
<div id="menu" class="screen" hidden><div class="panel" id="menuBody"></div></div>
<div id="fail" class="screen" hidden>
  <h1>3D ishlamadi</h1>
  <p id="failMsg">Bu qurilma yoki brauzer WebGL'ni qo'llamaydi. Boshqa brauzerda oching.</p>
</div>

  sfx('step',P.sc*1.4);
  var side=P.stepI%2?1:-1,rx=Math.cos(P.heading)*side*.5*P.sc,rz=-Math.sin(P.heading)*side*.5*P.sc;
  for(var i=0;i<3;i++)emit(P.x+rx,H(P.x,P.z)+.25,P.z+rz,rnd(-1,1),rnd(.8,2),rnd(-1,1),col,.7,.5*P.sc+.3,1.4*P.sc+.5,.7,2,1.5);
  if(P.sc>.6&&zoneOf(P.x,P.z)!=='v'&&!inCave)addPrint(P.x+rx,P.z+rz,P.sc,-P.heading);
  if(P.sc>1.1)shake=Math.max(shake,(P.sc-1.1)*.25);

  var gy=H(P.x,P.z),inWater=gy<WATER+.35,sprint=(keys.shift||btnSprint)&&mag>.1&&P.en>0&&!P.exhausted,sp=0,turn=0;
  if(mag>.08){
    var fx=Math.sin(cyaw),fz=Math.cos(cyaw),rx=-Math.cos(cyaw),rz=Math.sin(cyaw);
    var dx=fx*jz+rx*jx,dz=fz*jz+rz*jx,dl=Math.hypot(dx,dz)||1;dx/=dl;dz/=dl;

  }else P.amp+=(0-P.amp)*Math.min(1,8*dt);

  if(inWater&&!P.under&&sp>1){P.splashT-=dt;if(P.splashT<=0){P.splashT=.22;sfx('splash',.6);addRipple(P.x,P.z,P.sc);for(var i=0;i<5;i++)emit(P.x,WATER+.1,P.z,rnd(-2,2),rnd(2,5),rnd(-2,2),0xcfe8ff,.8,.5,.3,.8,9,.3)}}

  var cx=tx-Math.sin(cyaw)*Math.cos(cp)*d,cz=tz-Math.cos(cyaw)*Math.cos(cp)*d,cy=ty+Math.sin(cp)*d+1.2*sc;
  if(inCave){
    var ox=cx-tx,oy=cy-ty,oz=cz-tz,tt=1;
    for(var qq=0;qq<9;qq++){var px=tx+ox*tt,pz=tz+oz*tt;if(caveOpen(px,pz)&&caveOpen(px+1.2,pz)&&caveOpen(px-1.2,pz)&&caveOpen(px,pz+1.2)&&caveOpen(px,pz-1.2))break;tt-=.11}
    tt=Math.max(.12,tt);cx=tx+ox*tt;cz=tz+oz*tt;cy=Math.min(ty+oy*tt,13.5);
  }
  cy=Math.max(cy,H(cx,cz)+1.6);
  shake=Math.max(0,shake-dt*1.6);
  camera.position.set(cx+(Math.random()-.5)*shake,cy+(Math.random()-.5)*shake,cz+(Math.random()-.5)*shake);

}

/* ---------- radar + hud ---------- */
var rc=$('radar').getContext('2d');
function drawRadar(){
  var S=88,c=S/2,R=44,range=radarRange();rc.clearRect(0,0,S,S);
  rc.strokeStyle='rgba(244,236,211,.18)';rc.beginPath();rc.arc(c,c,R*.5,0,6.283);rc.stroke();
  var fx=Math.sin(cyaw),fz=Math.cos(cyaw),rx=-Math.cos(cyaw),rz=Math.sin(cyaw);
  function dot(x,z,col,r,edge){
    var dx=x-P.x,dz=z-P.z,sx=(dx*rx+dz*rz)/range*R,sy=-(dx*fx+dz*fz)/range*R;
    var d0=Math.hypot(sx,sy);if(d0>R-3){if(!edge)return;sx*=(R-3)/d0;sy*=(R-3)/d0}rc.fillStyle=col;rc.beginPath();rc.arc(c+sx,c+sy,r,0,6.283);rc.fill();
  }
  for(var i=0;i<npcs.length;i++){var n=npcs[i];dot(n.x,n.z,n.dead?'#a88b5a':(n.d.boss?'#c04bff':n.d.hostile?'#e5484d':'#f08a3c'),n.dead?2:(n.d.boss?5:3))}
  for(var j=0;j<babies.length;j++)dot(babies[j].x,babies[j].z,'#9bdc6a',2.5);
  if(inCave){for(var cj2=0;cj2<caveChests.length;cj2++)if(!caveChests[cj2].open)dot(caveChests[cj2].x,caveChests[cj2].z,'#ffd84a',2.5)}
  else for(var ck in vegChunks){var cc2=vegChunks[ck].chests;if(cc2)for(var cm=0;cm<cc2.length;cm++)if(!cc2[cm].open)dot(cc2[cm].x,cc2[cm].z,'#ffd84a',2.5)}
  if(nest&&!inCave)dot(nest.x,nest.z,'#4aa9e3',4);
  if(inCave){dot(EXIT.x,EXIT.z,'#f4c64e',4);for(var oi=0;oi<oreNodes.length;oi++){var on=oreNodes[oi];if(on.alive)dot(on.x,on.z,'#'+('000000'+ORE[on.type].c.toString(16)).slice(-6),2)}}
  else dot(ENT.x,ENT.z,'#5ce0ff',4,1);
  var qnb=null,qnd=1e12;for(var qi2=0;qi2<QN.length;qi2++)if(QN[qi2].cave===inCave){dot(QN[qi2].x,QN[qi2].z,'#f4c64e',3);var qd=sq(QN[qi2].x-P.x)+sq(QN[qi2].z-P.z);if(qd<qnd){qnd=qd;qnb=QN[qi2]}}
  if(qnb)dot(qnb.x,qnb.z,'#f4c64e',3,1);
  var hd=P.heading-cyaw;
  rc.fillStyle='#ffffff';rc.beginPath();
  rc.moveTo(c+Math.sin(hd)*6,c-Math.cos(hd)*6);
  rc.lineTo(c+Math.sin(hd+2.5)*5,c-Math.cos(hd+2.5)*5);
  rc.lineTo(c+Math.sin(hd-2.5)*5,c-Math.cos(hd-2.5)*5);rc.fill();
}
